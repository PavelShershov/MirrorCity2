<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Анимация от камеры</title>


<link rel="preload" as="fetch" href="models/full.glb" crossorigin="anonymous">

<link rel="preload" as="image" href="sostav/back.png" crossorigin="anonymous">


<script src="js/aframe.min.js"></script>
<script src="js/aframe-extras.min.js"></script>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


html,body{

width:100%;
height:100%;
overflow:hidden;
background:#3a3a3a;

}



#loadingScreen{

position:fixed;
left:0;
top:0;

width:100%;
height:100%;

background:#222;

z-index:100;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

transition:.5s;

}



#loadingScreen.hidden{

opacity:0;
pointer-events:none;

}



.loading-text{

font-size:24px;

color:white;

margin-bottom:30px;

font-weight:bold;

}



.loading-bar-container{

width:300px;

height:20px;

background:#555;

border-radius:10px;

overflow:hidden;

}



.loading-bar{

height:100%;

width:0%;

background:#00d9ff;

transition:.3s;

}



.corner-icon{

position:fixed;

z-index:20;

cursor:pointer;

width:64px;

top:10px;

left:10px;

}



</style>

</head>


<body>



<div id="loadingScreen">

<div class="loading-text">
Загрузка модели...
</div>

<div class="loading-bar-container">

<div class="loading-bar" id="loadingBar"></div>

</div>

</div>




<a-scene

id="arScene"

embedded

renderer="antialias:true;colorManagement:true"

vr-mode-ui="enabled:false"

device-orientation-permission-ui="enabled:false"

>


<a-assets>

<a-asset-item 
id="modelAsset"
src="models/full.glb">
</a-asset-item>


</a-assets>



<a-sky color="#3a3a3a"></a-sky>



<!-- Контейнер для масштабирования камеры -->

<a-entity id="cameraRig">



<a-entity

id="mainModel"

gltf-model="#modelAsset"

position="0 0 0"

scale="200 200 200"

rotation="0 0 0"

>

</a-entity>


</a-entity>




<a-camera

id="mainCamera"

position="0 0 5"

look-controls="enabled:false"

>

</a-camera>



</a-scene>




<img

id="backBtn"

class="corner-icon"

src="sostav/back.png"

alt="Назад">





<script>


(function(){


const scene=document.getElementById('arScene');

const model=document.getElementById('mainModel');

const rig=document.getElementById('cameraRig');

const loadingScreen=document.getElementById('loadingScreen');

const loadingBar=document.getElementById('loadingBar');





document.getElementById('backBtn')
.addEventListener('click',()=>{

window.location.href="index2.html";

});





/*
==============================
 PINCH ZOOM
==============================
*/


let startDistance=null;

let startScale=1;


let currentScale=1;


const minScale=0.6;

const maxScale=2.5;



scene.addEventListener(
'touchstart',
function(e){


if(e.touches.length===2){


startDistance=Math.hypot(

e.touches[0].clientX-
e.touches[1].clientX,


e.touches[0].clientY-
e.touches[1].clientY

);


startScale=currentScale;


}


},
{passive:false}

);




scene.addEventListener(
'touchmove',
function(e){


if(
e.touches.length===2 &&
startDistance
){


e.preventDefault();


let distance=Math.hypot(

e.touches[0].clientX-
e.touches[1].clientX,


e.touches[0].clientY-
e.touches[1].clientY

);



let zoom=

distance/startDistance;



currentScale=startScale*zoom;


currentScale=Math.max(
minScale,
Math.min(
maxScale,
currentScale
)
);



rig.setAttribute(
'scale',
`${currentScale} ${currentScale} ${currentScale}`
);



}



},
{passive:false}

);




scene.addEventListener(
'touchend',
function(){

startDistance=null;

}

);






/*
==============================
 LOAD MODEL
==============================
*/


let progress=0;


let timer=setInterval(()=>{

progress+=10;

if(progress>90)
progress=90;


loadingBar.style.width=
progress+"%";


},300);





model.addEventListener(
'model-loaded',
function(){



clearInterval(timer);


loadingBar.style.width="100%";


setTimeout(()=>{

loadingScreen.classList.add('hidden');

},500);




const mesh=model.getObject3D('mesh');



if(mesh){



console.log(
"Model loaded",
mesh.animations
);




if(
mesh.animations &&
mesh.animations.length>0
){


model.setAttribute(
'animation-mixer',
'clip:*;loop:true'
);


}






/*
Камера из GLB
*/


let embeddedCamera=null;



mesh.traverse(child=>{


if(child.isCamera){

embeddedCamera=child;

}


});





if(embeddedCamera){


const camera=
scene.camera;



function syncCamera(){


const pos=
new THREE.Vector3();


const quat=
new THREE.Quaternion();



embeddedCamera.getWorldPosition(pos);

embeddedCamera.getWorldQuaternion(quat);



camera.position.copy(pos);

camera.quaternion.copy(quat);



requestAnimationFrame(syncCamera);


}



syncCamera();



}




}


});





model.addEventListener(
'model-error',
function(){

loadingScreen
.querySelector('.loading-text')
.textContent=
"Ошибка загрузки";


});



})();


</script>


</body>
</html>
